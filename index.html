<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>cofounder — Build your AI-native company</title>
  <meta name="description" content="Build your AI-native company. With an AI cofounder. Make AI part of how your company thinks, builds, and runs. You bring the ambition and judgment.">
  <link rel="canonical" href="https://cofounder.run/">
  <meta property="og:title" content="cofounder — Build your AI-native company">
  <meta property="og:description" content="Build your AI-native company. With an AI cofounder. Make AI part of how your company thinks, builds, and runs. You bring the ambition and judgment.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cofounder.run/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:site" content="@cofounder_run">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffffff'/%3E%3Cpath d='M28 20L16 32l12 12m8-24l12 12-12 12' fill='none' stroke='%23000000' stroke-width='5'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: dark; --bg: #050505; --text: #f5f5f5; --muted: #8f8f98; --line: #26262c; --panel: #111114; --on-accent: #050505; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    .page { width: min(960px, calc(100% - 64px)); margin: auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 36px 0; font-size: 23px; font-weight: 650; letter-spacing: -.025em; }
    header a { color: var(--muted); font-size: 17px; font-weight: 400; letter-spacing: 0; text-decoration: none; padding: 10px 0; }
    header a:hover { color: var(--text); }
    a:focus-visible { outline: 2px solid var(--text); outline-offset: 6px; }
    main { max-width: 740px; padding: 72px 0 64px; }
    h1 { font-size: clamp(34px, calc(5vw + 14px), 66px); font-weight: 600; letter-spacing: -.035em; line-height: 1.12; margin: 0 0 28px; }
    .with-cofounder { display: block; margin-top: 16px; font-size: clamp(22px, 2.5vw, 30px); font-weight: 500; line-height: 1.35; letter-spacing: -.015em; }
    .positioning { max-width: 540px; font-size: clamp(20px, 2vw, 24px); line-height: 1.45; letter-spacing: -.01em; margin: 0 0 16px; text-wrap: pretty; }
    .description { max-width: 540px; color: var(--muted); font-size: 20px; line-height: 1.6; margin: 0; }
    form { max-width: 540px; margin-top: 32px; }
    label { display: block; font-size: 16px; color: var(--muted); margin-bottom: 12px; }
    .fields { display: flex; gap: 10px; }
    input, button { font: inherit; line-height: 1.5; border-radius: 8px; min-height: 56px; }
    input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 12px 14px; font-size: 16px; transition: border-color .2s; }
    input::placeholder { color: var(--muted); opacity: 1; }
    input:hover { border-color: #3a3a42; }
    input:focus-visible { outline: none; border-color: #f5f5f5; }
    button { border: 1px solid #f5f5f5; background: #f5f5f5; color: var(--on-accent); padding: 12px 21px; font-size: 16px; font-weight: 650; cursor: pointer; white-space: nowrap; transition: background .15s, box-shadow .15s; }
    button:hover { background: #ffffff; box-shadow: 0 4px 20px rgba(255,255,255,.15); }
    button:disabled { opacity: .55; cursor: default; box-shadow: none; }
    input:focus-visible, button:focus-visible { outline: 2px solid #f5f5f5; outline-offset: 4px; }
    .note { font-size: 16px; line-height: 1.5; color: var(--muted); margin: 18px 0 0; }
    .status { max-width: 540px; min-height: 24px; font-size: 16px; line-height: 1.5; margin: 13px 0 0; }
    .status[data-state="success"] { color: #f5f5f5; }
    .status[data-state="error"] { color: #ff9d92; }
    ::selection { color: #050505; background: #f5f5f5; }
    @media (max-width: 600px) {
      .page { width: calc(100% - 40px); }
      header { padding: 24px 0; font-size: 21px; }
      main { padding: 40px 0 40px; }
      h1 { letter-spacing: -.03em; margin-bottom: 24px; }
      .description { font-size: 20px; line-height: 1.6; }
      .fields { flex-direction: column; }
      input, button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header><span>cofounder<span style="color:#8f8f98">.</span></span><nav aria-label="Main navigation"><a href="/manifest/">Manifest</a></nav></header>
    <main>
      <h1>Build your<br>AI-native company.<span class="with-cofounder">With an AI cofounder.</span></h1>
      <p class="positioning">The AI-native operating system for your company.</p>
      <p class="description">Make AI part of how your company thinks, builds, and runs. You bring the ambition and judgment.</p>
      <form id="waitlist">
        <label for="contact">Email</label>
        <div class="fields">
          <input id="contact" name="email" type="email" autocomplete="email" placeholder="you@company.com" maxlength="254" required>
          <button type="submit">Join early access</button>
        </div>
      </form>
      <p class="note">No payment to join. We’ll email you when it’s ready.</p>
      <p id="msg" class="status" role="status" aria-live="polite"></p>
      <noscript><p class="note">Enable JavaScript to join early access.</p></noscript>
    </main>
  </div>
  <script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw5vAZ-trf_PnWZBCLPT8Woqt0meTefRB-cPBTDlJXpu44S6zq0vKsgTCgfkJC-w2YN/exec';
const form = document.getElementById('waitlist');
form.addEventListener('submit', async event => {
  event.preventDefault();
  const input = document.getElementById('contact');
  const button = form.querySelector('button');
  const message = document.getElementById('msg');
  if (button.disabled || !form.reportValidity()) return;
  button.disabled = true; input.readOnly = true; form.setAttribute('aria-busy', 'true');
  message.dataset.state = 'sending'; message.textContent = 'Sending your request…';
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 15000);
  try {
    const response = await fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ contact: input.value.trim() }), signal: controller.signal });
    if (!response.ok) throw new Error('Request failed');
    const data = await response.json();
    if (data.ok !== true) throw new Error('Request not confirmed');
    message.dataset.state = 'success'; message.textContent = 'You’re on the list. We’ll email you about access.';
    input.value = ''; button.textContent = 'Request received ✓';
  } catch (error) {
    message.dataset.state = 'error'; message.textContent = 'We couldn’t confirm your request. Please try again.';
    button.disabled = false;
  } finally { clearTimeout(timeout); input.readOnly = false; form.removeAttribute('aria-busy'); }
});
  </script>
</body>
</html>
